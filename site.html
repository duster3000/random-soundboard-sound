        function clearSounds() {
            localStorage.removeItem('myinstants-sounds');
            soundLinksSet.clear();
            console.log("✅Cleared all sounds from localStorage");
        }
        function getStoredSounds() {
        const stored = localStorage.getItem('myinstants-sounds');
        return stored ? new Set(JSON.parse(stored)) : new Set(soundLinks);
        }

        function saveSounds(sounds) {
            if (sounds == getStoredSounds()) {
                console.log("✅No new sounds to save");
                return;
            }
            else{
                localStorage.setItem('myinstants-sounds', JSON.stringify(Array.from(sounds)));
                console.log(`✅Saved ${sounds.size} sounds to localStorage`);
                soundLinksSet = sounds;
            }
        }
        
        async function scrapeAndAddSoundsFromURL(url="https://www.myinstants.com/nl/index/be/") 
        {
            try{
                const response = await fetch("https://corsproxy.io/?" + encodeURIComponent(url));
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                const links = Array.from(doc.querySelectorAll('div.instant a')).map(a => (a.href).replace("file:///D:/", "https://www.myinstants.com/"));

                const current = getStoredSounds();
                const originalSize = current.size;

                links.forEach(link => current.add(link));
                saveSounds(current);

                const added = current.size - originalSize;
                console.log(`✅Added ${added} new sounds from ${url}`);
            } catch (error) {
                console.error("Error scraping sounds:", error);}
        }

        async function getRandomSound() {
            try 
            {   
                let soundLinksArray = Array.from(soundLinksSet);
                if (soundLinksArray.length === 0) {
                    console.warn("No sounds available.");
                    return null;
                }
                
                const randomIndex = Math.floor(Math.random() * soundLinksArray.length);
                const url = soundLinksArray[randomIndex];
                const response = await fetch("https://corsproxy.io/?" + encodeURIComponent(url));
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                const button = doc.querySelector("#instant-page-button-element");
                
                if (!button) {
                    console.warn("No button on page:", url);
                    getRandomSound();
                }

                const mp3Link = "https://www.myinstants.com" + button.getAttribute("data-url");
                
                return mp3Link;
            } catch (error) 
            {
                console.error("Error fetching random sound:", error);
                return null;
            }
        }   

        async function changeRandomSound() {
            const soundFrame = container.querySelector('audio');
            mp3Link = await getRandomSound();
            if (mp3Link) {
                soundFrame.src = mp3Link;
            } else {
                console.warn("No valid mp3 link found.");
            }
        }
        
        async function playSound() {
            try{
                const soundFrame = document.getElementById('mySound');
                if (!soundFrame.src) {
                    await changeRandomSound();
                }
                // if the sound is still playing, stop it
                if (!soundFrame.paused) {
                    soundFrame.pause();
                    soundFrame.currentTime = 0; // reset to start
                }
                console.log("Now playing: ", soundFrame.src);   
                soundFrame.play().catch(error => {
                    console.error("Error playing sound:", error);
                });
                } catch (error) {
                console.error("Error in playSound function:", error);
                }
        }
