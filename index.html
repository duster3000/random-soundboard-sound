            </p>
            <div id="main-instant">

                <option value="NL">Netherlands</option>
                <option value="FR">France</option>

                <option value="DE">Germany</option>

        </div>
        <div id="stat_info" class="content">

                <div id="session-sounds">

                    <button title="Clear sounds from session" onclick="clearSoundsFromSession()">Clear</button>
                </div>
                <div id="storage-sounds">
                    <p>Total sounds in storage: <span id="storage-sound-count"> </span></p>
                    <button title="Clear sounds from storage" onclick="clearSoundsFromStorage()">Clear</button>
                </div>
            </div>
        </div>
        <div class="github-link">
            <a target="_blank" href="https://github.com/duster3000/random-soundboard-sound">GitHub repo</a>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 ThorstProductions</p>

        let soundLinksSet = new Set();
        const container = document.getElementById("main-instant");

        async function updateStats() {
            document.getElementById("session-sound-count").textContent = soundLinksSet.size;
            document.getElementById("storage-sound-count").textContent = (await getStoredSounds()).size;
        }

        async function clearSoundsFromStorage() {
            localStorage.removeItem('myinstants-sounds');
            console.log("✅Cleared all sounds from localStorage");
            await updateStats()
        }
        async function clearSoundsFromSession() {
            soundLinksSet.clear();
            console.log("✅Cleared all sounds from the current session");
            await updateStats()
        }

        async function getStoredSounds() {
            const stored = localStorage.getItem('myinstants-sounds');
            return stored ? new Set(JSON.parse(stored)) : new Set();
        }

        async function loadFromStorage() {
            const storedSounds = await getStoredSounds();
            if (storedSounds.size == 0) {
                console.log("🟡No sounds found in localStorage.");
                return false;

            } else {
                soundLinksSet = new Set([...soundLinksSet, ...storedSounds]); // Merge global session set with stored sounds
                console.log(`✅Loaded ${storedSounds.size} sounds from localStorage`);
                await updateStats();
                return true;
            }

        }

        async function saveSoundsToStorage(sounds) {
            const storedSounds = await getStoredSounds();
            if (sounds == storedSounds) {
                console.log("🟡No new sounds to save");
                return;
            }
            else {
                const merged = new Set([...sounds, ...storedSounds]);
                localStorage.setItem('myinstants-sounds', JSON.stringify(Array.from(merged)));
                console.log(`✅Saved ${merged.size - storedSounds.size} new sounds to localStorage`);
                await updateStats();
            }
        }

        async function deleteSound(soundUrl) {
            soundLinksSet.delete(soundUrl);
            newStoredSounds = await getStoredSounds()
            if (newStoredSounds.has(soundUrl)) {
                newStoredSounds.delete(soundUrl);
                localStorage.setItem('myinstants-sounds', JSON.stringify(Array.from(newStoredSounds)));
            }
            else console.log("Sound not found in storage.");

            const soundName = soundUrl.split('/').pop();
            console.log(`✅Deleted ${soundName} from session and storage.`);
            await updateStats();
        }

        async function deleteCurrentSound() {
            const soundFrame = document.getElementById("mySound");
            if (soundFrame.src) {
                const currentSoundUrl = soundFrame.src;
                await deleteSound(currentSoundUrl); // Delete the current sound
                await changeRandomSound(); // Change to a new random sound
            } else {
                console.warn("No sound is currently playing to delete.");
            }
        }

        // scraping
        async function scrapeAndAddSoundsFromURL(url = "https://www.myinstants.com/nl/index/be/", maxPages = 6) {
            try {
                const originalSize = soundLinksSet.size;
                for (let page = 1; page <= maxPages; page++) {
                    const pageUrl = url + "?page=" + page;
                    console.log(`Scraping sounds from: ${pageUrl}`);

                    const response = await fetch("https://corsproxy.io/?" + encodeURIComponent(pageUrl));
                    const html = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, "text/html");
                    const links = Array.from(doc.querySelectorAll('div.instant a')).map(a => "https://www.myinstants.com" + a.getAttribute('href'));
                    console.log(links);
                    if (links.length === 0) {
                        console.warn("🟡No sound links found on the page.");
                        break;
                    }
                    for (const link of links) {
                        const mp3Link = await getMp3link(link);
                        if (mp3Link) {
                            soundLinksSet.add(mp3Link);
                            await sleep(250);
                        } else {
                            console.warn("🟡No mp3 link found for:", link);
                        }
                    }
                    await updateStats();
                    await sleep(250); // wait before next page
                }
                const added = soundLinksSet.size - originalSize;
                if (added === 0) {
                    console.log("🟡No new sounds found to add.");
                    return;
                }
                else {
                    console.log(`✅Added ${added} new sounds from ${url} to session set.`);
                    await updateStats();
                }
            } catch (error) {
                console.error("Error scraping sounds:", error);
            }
        }

        async function getMp3link(url) {
            try {
                const response = await fetch("https://corsproxy.io/?" + encodeURIComponent(url));
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                const button = doc.querySelector("#instant-page-button-element");
                if (button) {
                    const mp3Link = "https://www.myinstants.com" + button.getAttribute("data-url");
                    console.log("MP3 Link:", mp3Link);
                    return mp3Link;
                } else {
                    console.warn("No button found on page:", url);
                    return;
                }
            } catch (error) {
                console.error("Error fetching/parsing sound page:", error);
                return;
            }
        }

        async function getRandomSound() {
            try {
                if (soundLinksSet.size === 0) {
                    console.warn("No sounds available. Loading from storage...");
                    if (loadFromStorage() == false) {
                        console.warn("🟡No sounds found in storage either. Using default sounds...");
                        soundLinksSet = new Set(soundLinks);
                    }
                }
                let soundLinksArray = Array.from(soundLinksSet);
                let attemptCount = 0;
                const maxAttempts = 20;
                while (attemptCount < maxAttempts) {
                    const randomIndex = Math.floor(Math.random() * soundLinksArray.length);
                    const mp3link = soundLinksArray[randomIndex];
                    attemptCount++;
                    try {
                        response = fetch("https://corsproxy.io/?" + encodeURIComponent(mp3link), { method: 'HEAD' }).then(res => res.ok);
                        if (!response) {
                            console.warn(`Sound link seems invalid (not reachable): ${mp3link}. Trying another one...`);
                            deleteSound(mp3link);
                            soundLinksArray = Array.from(soundLinksSet);
                            continue; // try again
                        }
                        else return mp3link;

                    } catch (err) {
                        console.warn("Fetch/parsing failed:", err);
                        continue; // try again
                    }
                }
                console.warn("No valid sound found after max attempts.");
                return null;
            } catch (error) {
                console.error("Error fetching random sound:", error);
                return null;
            }
        }

        async function changeRandomSound() {
            const soundFrame = container.querySelector('audio');
            const mp3Link = await getRandomSound();
            if (mp3Link) {
                soundFrame.src = mp3Link;
                console.log("Random sound changed.")
            } else {
                console.warn("No valid mp3 link found.");
            }
        }

        async function playSound() {
            try {
                const soundFrame = document.getElementById('mySound');
                if (!soundFrame.src || soundFrame.src === "" || !(soundFrame.src.endsWith("mp3"))) {
                    await changeRandomSound();
                }
                // if the sound is still playing, stop it
                if (!soundFrame.paused) {
                    soundFrame.pause();
                    soundFrame.currentTime = 0; // reset to start
                }
                console.log("Now playing: ", soundFrame.src);
                await soundFrame.play();
            }
            catch (error) {
                console.error("Error in playSound function:", error);
            }
        }
        async function downloadSound() {
            const soundFrame = document.getElementById('mySound');
            const url = soundFrame.src;
            if (!url) {
                console.warn("No sound is currently loaded to download.");
                return;
            }

            const filename = url.split('/').pop();
            const response = await fetch("https://corsproxy.io/?" + encodeURIComponent(url));
            const blob = await response.blob();

            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            URL.revokeObjectURL(a.href); // cleanup
            console.log("✅Sound downloaded:", filename);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            console.log("Document is ready!");
            await updateStats();
            await loadFromStorage();
            await changeRandomSound();

        });
